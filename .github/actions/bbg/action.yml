name: Setup Baseband Guard (BBG)
description: Integrate Baseband Guard at an immutable revision without its network installer
inputs:
  commit:
    description: Full BBG commit SHA; required for reproducible builds
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install pinned Baseband Guard
      if: inputs.commit != ''
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        EXPECTED_BBG_COMMIT: ${{ inputs.commit }}
      run: |
        set -euo pipefail
        [[ "$EXPECTED_BBG_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
        test ! -e Baseband-guard
        test ! -L Baseband-guard
        git init Baseband-guard
        git -C Baseband-guard remote add origin https://github.com/vc-teahouse/Baseband-guard.git
        git -C Baseband-guard fetch origin "$EXPECTED_BBG_COMMIT"
        git -C Baseband-guard checkout --detach "$EXPECTED_BBG_COMMIT"
        test "$(git -C Baseband-guard rev-parse HEAD)" = "$EXPECTED_BBG_COMMIT"
        test ! -f Baseband-guard/.git/shallow
        python3 "$GITHUB_WORKSPACE/.github/scripts/bbg_integrate_pinned.py" "$PWD"
        echo "BBG_COMMIT=$EXPECTED_BBG_COMMIT" >> "$GITHUB_ENV"
    
    - name: Install Baseband Guard
      if: inputs.commit == ''
      uses: ./.github/actions/retry
      with:
        command: |
          set -o pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
        attempts: 5
        delay: 5
        workdir: ${{ github.workspace }}/kernel
    
    - name: Apply 6.18 compatibility shim
      # Upstream BBG calls blkdev_get_no_open() without declaring it; the
      # prototype lived in include/linux/blkdev.h until 6.18 moved it into the
      # private block/blk.h and 6.15 added a `bool autoload` argument. Re-declare
      # it version-aware and route the unguarded call through a wrapper.
      # No-op on older kernels (identical prototype / unused inline helper).
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        BBG_DIR="common/security/baseband-guard"
        [ -d "$BBG_DIR" ] || { echo "ERROR: pinned BBG integration missing" >&2; exit 1; }
        python3 "${GITHUB_WORKSPACE}/.github/scripts/bbg_618_compat.py" "$BBG_DIR"

    - name: Configure Baseband Guard
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Modify security Kconfig to include baseband_guard in LSM
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig
    
    - name: Verify BBG Installation
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        if grep -q "baseband_guard" common/security/Kconfig; then
          echo "[+] SUCCESS: baseband_guard found in common/security/Kconfig"
          grep -n "baseband_guard" common/security/Kconfig || true
        else
          echo "[-] FAILED: baseband_guard not found in common/security/Kconfig"
          exit 1
        fi
    
    - name: Extract BBG Version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/Baseband-guard
      run: |
        # Extract and export BBG version info
        BBG_COMMIT=$(git rev-parse HEAD)
        echo "BBG_COMMIT=$BBG_COMMIT" >> "$GITHUB_ENV"

    - name: Enable Kernel Configs
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" \
          "${{ github.workspace }}/.github/actions/bbg/enable-kernel-configs.fragment" \
          --dest wild_defconfig.fragment --label enable-kernel-configs
