name: Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android 版本'
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
        default: android14
      kernel_version:
        description: 'Kernel 版本'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
        default: "6.1"
      sub_level:
        description: 'Sub Level 版本'
        required: true
        type: string
        default: '138'
      os_patch_level:
        description: 'OS Patch Level'
        required: true
        type: string
        default: '2026-02'
      revision:
        description: 'Android 12 Revision (可选)'
        required: false
        type: string
        default: ''
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Stable(标准)
      kernelsu_commit:
        description: '指定 KernelSU commit hash (可选)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash'
        required: false
        type: string
        default: ''
      custom_version:
        description: '自定义版本名称 (可选)'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      supp_op:
        description: '启用 OnePlus 8E 支持'
        required: true
        type: boolean
        default: false
      set_defbbr:
        description: '设置 BBR 为默认拥塞算法'
        required: true
        type: boolean
        default: false
      make_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip
          pip install PyYAML

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-

      - name: Build kernel
        run: |
          cd ./.github/workflows/scripts

          ARGS="--android ${{ github.event.inputs.android_version }}"
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel_version }}"
          ARGS="$ARGS --sub-level ${{ github.event.inputs.sub_level }}"
          ARGS="$ARGS --os-patch ${{ github.event.inputs.os_patch_level }}"
          [ -n "${{ github.event.inputs.revision }}" ] && ARGS="$ARGS --revision ${{ github.event.inputs.revision }}"
          ARGS="$ARGS --ksu-version ${{ github.event.inputs.kernelsu_version }}"

          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.use_kpm }}" = "false" ] && ARGS="$ARGS --no-kpm"
          [ "${{ github.event.inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ "${{ github.event.inputs.supp_op }}" = "true" ] && ARGS="$ARGS --op8e"
          [ "${{ github.event.inputs.set_defbbr }}" = "true" ] && ARGS="$ARGS --bbr"
          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"
          [ -z "${{ github.event.inputs.custom_version }}" ] || ARGS="$ARGS --custom-version=${{ github.event.inputs.custom_version }}"
          [ "${{ github.event.inputs.make_release }}" = "true" ] || ARGS="$ARGS --no-release"

          python3 build.py $ARGS

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*.img" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "source-manifest.txt" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*AnyKernel3.zip.filelist.txt" -type f -exec cp {} artifacts/ \;

      - name: Build SukiSU manager APK (same commit as driver)
        continue-on-error: true
        run: |
          cd ./.github/workflows/scripts
          python3 build_manager_apk.py "$GITHUB_WORKSPACE/artifacts" || echo "manager APK 构建失败（非致命，可后续单独出）"

      - name: Verify manager == driver commit
        run: |
          cd ./.github/workflows/scripts
          MANIFEST=$(find /tmp/gki-build -name source-manifest.txt | head -1)
          echo "source-manifest: $MANIFEST"; cat "$MANIFEST" || true
          if [ -f "$GITHUB_WORKSPACE/artifacts/manager-commit.txt" ]; then
            cat "$GITHUB_WORKSPACE/artifacts/manager-commit.txt"
            MGR=$(grep -oE 'sukisu_commit=[0-9a-f]+' "$GITHUB_WORKSPACE/artifacts/manager-commit.txt" | cut -d= -f2)
            DRV=$(python3 -c "import json,glob;print(json.load(open(glob.glob('/tmp/gki-build/**/source-manifest.txt',recursive=True)[0]))['sukisu_resolved_commit'] or '')")
            echo "manager=$MGR driver=$DRV"
            if [ -n "$MGR" ] && [ -n "$DRV" ] && [ "$MGR" != "$DRV" ]; then
              echo "::error::manager($MGR) 与 driver($DRV) 不同源"; exit 1
            fi
          else
            echo "未构建管理器 APK，跳过同源核对"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}
          path: artifacts/*

      - name: Generate checksums
        run: |
          echo "=== Creating checksums ==="
          sha256sum artifacts/* > SHA256SUMS.txt
          cp SHA256SUMS.txt artifacts/ || true
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: ${{ github.event.inputs.make_release == 'true' && success() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: aurora-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.sub_level }}-${{ github.run_number }}
          name: "GKI ${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.sub_level }} SukiSU+SUSFS (aurora) #${{ github.run_number }}"
          body: |
            自动构建的 aurora (Xiaomi 14 Ultra 国行) GKI 内核包。
            - 内核: android14-${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.sub_level }}（ACK tag 固定 + SUBLEVEL 门禁）
            - SukiSU-Ultra: v4.1.3（内核驱动与管理器 APK 同源）
            - SUSFS: v2.2.0（读实际源码校验）
            - AK3 仅替换 boot 分区内核 Image；init_boot 不改动。
            详见附件 source-manifest.txt / SHA256SUMS.txt。
          files: |
            artifacts/*
          fail_on_unmatched_files: false

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          cd ./.github/workflows/scripts
          python3 telegram_notify.py single \
            "${{ github.event.inputs.android_version }}" \
            "${{ github.event.inputs.kernel_version }}" \
            "${{ github.event.inputs.sub_level }}" \
            "${{ github.event.inputs.os_patch_level }}" \
            "${{ github.event.inputs.kernelsu_version }}" \
            "${{ github.event.inputs.use_zram }}" \
            "${{ github.event.inputs.use_kpm }}" \
            "../../SHA256SUMS.txt"
