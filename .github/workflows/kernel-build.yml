name: Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android 版本'
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
        default: android14
      kernel_version:
        description: 'Kernel 版本'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
        default: "6.1"
      sub_level:
        description: 'Sub Level 版本'
        required: true
        type: string
        default: '138'
      os_patch_level:
        description: 'OS Patch Level'
        required: true
        type: string
        default: '2026-02'
      revision:
        description: 'Android 12 Revision (可选)'
        required: false
        type: string
        default: ''
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Stable(标准)
      kernelsu_commit:
        description: '指定 KernelSU commit hash (可选)'
        required: false
        type: string
        default: ''
      sukisu_mode:
        description: 'SukiSU 模式：ci=管理器 main/40856 + builtin 源码；stable=稳定同源'
        required: true
        type: choice
        options:
          - ci
          - stable
        default: ci
      manager_commit:
        description: '管理器 main commit（ci_3671 / 40856 默认 35467545...）'
        required: false
        type: string
        default: '35467545b2826e3acfc88699755981a889956b1a'
      manager_version_code:
        description: '管理器 versionCode 基准（默认 40856）'
        required: false
        type: string
        default: '40856'
      manager_ci_run:
        description: '管理器 CI 标签（ci_3671 = main rev-list count）'
        required: false
        type: string
        default: 'ci_3671'
      kernel_builtin_commit:
        description: '内核 builtin 源码 commit（含 KSU_SUSFS）'
        required: false
        type: string
        default: 'b1d534bc41941b2c818d7a1a1dac341e4aabfc2d'
      susfs_commit:
        description: '指定 SUSFS commit hash'
        required: false
        type: string
        default: ''
      custom_version:
        description: '自定义版本名称 (可选)'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      supp_op:
        description: '启用 OnePlus 8E 支持'
        required: true
        type: boolean
        default: false
      set_defbbr:
        description: '设置 BBR 为默认拥塞算法'
        required: true
        type: boolean
        default: false
      make_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip
          pip install PyYAML

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-

      - name: Build kernel
        run: |
          cd ./.github/workflows/scripts

          ARGS="--android ${{ github.event.inputs.android_version }}"
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel_version }}"
          ARGS="$ARGS --sub-level ${{ github.event.inputs.sub_level }}"
          ARGS="$ARGS --os-patch ${{ github.event.inputs.os_patch_level }}"
          [ -n "${{ github.event.inputs.revision }}" ] && ARGS="$ARGS --revision ${{ github.event.inputs.revision }}"
          ARGS="$ARGS --ksu-version ${{ github.event.inputs.kernelsu_version }}"

          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.use_kpm }}" = "false" ] && ARGS="$ARGS --no-kpm"
          [ "${{ github.event.inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ "${{ github.event.inputs.supp_op }}" = "true" ] && ARGS="$ARGS --op8e"
          [ "${{ github.event.inputs.set_defbbr }}" = "true" ] && ARGS="$ARGS --bbr"
          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"
          [ -z "${{ github.event.inputs.custom_version }}" ] || ARGS="$ARGS --custom-version=${{ github.event.inputs.custom_version }}"
          ARGS="$ARGS --sukisu-mode=${{ github.event.inputs.sukisu_mode }}"
          [ -z "${{ github.event.inputs.manager_commit }}" ] || ARGS="$ARGS --manager-commit=${{ github.event.inputs.manager_commit }}"
          [ -z "${{ github.event.inputs.manager_version_code }}" ] || ARGS="$ARGS --manager-version-code=${{ github.event.inputs.manager_version_code }}"
          [ -z "${{ github.event.inputs.manager_ci_run }}" ] || ARGS="$ARGS --manager-ci-run=${{ github.event.inputs.manager_ci_run }}"
          [ -z "${{ github.event.inputs.kernel_builtin_commit }}" ] || ARGS="$ARGS --kernel-builtin-commit=${{ github.event.inputs.kernel_builtin_commit }}"
          [ "${{ github.event.inputs.make_release }}" = "true" ] || ARGS="$ARGS --no-release"

          python3 build.py $ARGS

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp -v {} artifacts/ \;
          find /tmp/gki-build -name "Image" -type f -exec cp -v {} artifacts/ \; || true
          find /tmp/gki-build -name "source-manifest.txt" -type f -exec cp -v {} artifacts/ \;
          find /tmp/gki-build -name "*AnyKernel3.zip.filelist.txt" -type f -exec cp -v {} artifacts/ \; || true
          find /tmp/gki-build -name "*AnyKernel3.zip.sha256" -type f -exec cp -v {} artifacts/ \; || true
          if ls artifacts/*AnyKernel3.zip >/dev/null 2>&1; then
            for z in artifacts/*AnyKernel3.zip; do
              base=$(basename "$z")
              if [[ "$base" != *"CI40856"* ]]; then
                cp -v "$z" "artifacts/android14-6.1.138-aurora-SukiSU-CI40856-matched-SUSFS2.2-KPM-LZ4KD-BBR-AnyKernel3.zip"
              fi
            done
          fi
          ls -lah artifacts || true

      - name: Setup JDK for manager APK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build SukiSU manager APK (main pin / 40856)
        env:
          SUKISU_MANAGER_COMMIT: ${{ github.event.inputs.manager_commit }}
          SUKISU_MANAGER_VERSION_CODE: ${{ github.event.inputs.manager_version_code }}
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME"
          cd ./.github/workflows/scripts
          # Manager binary is optional (user keeps official CI APK); metadata must exist.
          python3 build_manager_apk.py "$GITHUB_WORKSPACE/artifacts" || true
          if [ ! -f "$GITHUB_WORKSPACE/artifacts/manager-commit.txt" ]; then
            cat > "$GITHUB_WORKSPACE/artifacts/manager-commit.txt" <<EOF
          sukisu_mode=ci
          sukisu_manager_ref=main
          sukisu_manager_commit=${{ github.event.inputs.manager_commit }}
          sukisu_manager_ci=${{ github.event.inputs.manager_ci_run }}
          sukisu_kernel_builtin_ref=builtin
          sukisu_kernel_builtin_commit=${{ github.event.inputs.kernel_builtin_commit }}
          commit_count=3671
          expected_version_code=40856
          manager_version_code_baseline=${{ github.event.inputs.manager_version_code }}
          apk_build_status=metadata_only
          note=official_user_apk_is_baseline_local_build_optional
          official_user_apk_required=true
          apks=[]
          EOF
          fi
          # normalize indentation just in case
          sed -i 's/^[[:space:]]*//' "$GITHUB_WORKSPACE/artifacts/manager-commit.txt"
          cat "$GITHUB_WORKSPACE/artifacts/manager-commit.txt"
          grep -E '^expected_version_code=40856$' "$GITHUB_WORKSPACE/artifacts/manager-commit.txt"

      - name: Hard gate manager/driver/API versionCode
        env:
          WANT_VC: ${{ github.event.inputs.manager_version_code }}
          MANAGER_COMMIT_TXT: ${{ github.workspace }}/artifacts/manager-commit.txt
        run: |
          set -euo pipefail
          MANIFEST=$(find /tmp/gki-build -name source-manifest.txt | head -1)
          echo "source-manifest: $MANIFEST"
          test -f "$MANIFEST"
          cat "$MANIFEST"
          test -f "$MANAGER_COMMIT_TXT"
          cat "$MANAGER_COMMIT_TXT"
          cd ./.github/workflows/scripts
          python3 verify_manager_driver_gate.py
          ls -lah "$GITHUB_WORKSPACE/artifacts"/*AnyKernel3.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}
          path: artifacts/*

      - name: Generate checksums
        run: |
          echo "=== Creating checksums ==="
          sha256sum artifacts/* > SHA256SUMS.txt
          cp SHA256SUMS.txt artifacts/ || true
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: ${{ github.event.inputs.make_release == 'true' && success() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: aurora-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.sub_level }}-CI${{ github.event.inputs.manager_version_code }}-${{ github.run_number }}
          name: "GKI ${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.sub_level }} SukiSU-CI${{ github.event.inputs.manager_version_code }} matched SUSFS2.2 KPM LZ4KD BBR (aurora) #${{ github.run_number }}"
          body: |
            自动构建的 aurora (Xiaomi 14 Ultra 国行) GKI 内核包。
            - 内核: android14-${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.sub_level }}（ACK tag 固定 + SUBLEVEL 门禁）
            - SukiSU mode: ${{ github.event.inputs.sukisu_mode }}
            - Manager baseline: versionCode ${{ github.event.inputs.manager_version_code }} / ${{ github.event.inputs.manager_ci_run }} @ ${{ github.event.inputs.manager_commit }}
            - Kernel source: builtin@${{ github.event.inputs.kernel_builtin_commit }}（含 KSU_SUSFS）
            - Driver versionCode: 强制与 manager 一致（禁止 37973 旧映射）
            - 旧 aurora 产物若为 driver 37973：FAILED / DO NOT FLASH
            - SUSFS: v2.2.0（读实际源码校验）
            - AK3 仅替换 boot 分区内核 Image；init_boot 不改动。
            详见附件 source-manifest.txt / SHA256SUMS.txt。
          files: |
            artifacts/*
          fail_on_unmatched_files: false

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          cd ./.github/workflows/scripts
          python3 telegram_notify.py single \
            "${{ github.event.inputs.android_version }}" \
            "${{ github.event.inputs.kernel_version }}" \
            "${{ github.event.inputs.sub_level }}" \
            "${{ github.event.inputs.os_patch_level }}" \
            "${{ github.event.inputs.kernelsu_version }}" \
            "${{ github.event.inputs.use_zram }}" \
            "${{ github.event.inputs.use_kpm }}" \
            "../../SHA256SUMS.txt"
