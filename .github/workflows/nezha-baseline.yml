name: Nezha Binder regression isolation
run-name: Nezha out-of-line SysV state and real ARM64 IPC tests — diagnostic only (recovery push)
on:
  push:
    branches: [fix/nezha-r74-binder-baseline]
    paths:
      - .github/workflows/nezha-baseline.yml
      - .github/scripts/nezha_baseline.py
      - .github/scripts/nezha_ds_candidate.py
      - .github/scripts/nezha_sysv*
permissions:
  contents: read
  actions: read
concurrency:
  group: nezha-r74-isolation
  cancel-in-progress: false
jobs:
  baseline:
    name: isolate-${{ matrix.feature }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        feature: [droidspaces]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner disk and packages
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y erofs-utils build-essential git curl python3 zip unzip bison flex libssl-dev libelf-dev bc rsync dwarves qemu-system-arm gcc-aarch64-linux-gnu
          df -h .
      - name: Read only the matching public OTA module partition
        timeout-minutes: 25
        run: |
          mkdir -p reports
          python3 .github/scripts/nezha_baseline.py fetch --output system_dlkm.img
          fsck.erofs --extract=original-modules system_dlkm.img
          test -f original-modules/flatten/lib/modules/rust_binder.ko
          grep -n rust_binder original-modules/flatten/lib/modules/modules.load | tee reports/original-load-order.txt
      - name: Recover exact dependency manifest from the passed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45166730693 --repo "$GITHUB_REPOSITORY" --name nezha-r74-baseline-45166730693 --dir baseline-reference
          test -s baseline-reference/resolved-manifest.xml
          cp baseline-reference/binder-result.json reports/passed-baseline-binder.json
          cp baseline-reference/built.config reports/passed-baseline.config
      - name: Sync exactly the same source and dependency commits
        timeout-minutes: 55
        run: |
          curl -fL --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
          mkdir kernel
          cd kernel
          "$RUNNER_TEMP/repo" init --depth=1 --no-clone-bundle -u https://android.googlesource.com/kernel/manifest -b common-android16-6.12-2026-03
          cp ../baseline-reference/resolved-manifest.xml .repo/manifests/default.xml
          "$RUNNER_TEMP/repo" sync -c --no-tags --no-clone-bundle --fail-fast -j4
          test "$(git -C common rev-parse HEAD)" = b1d12d482d767c50cb792d988e4479d3f75c342a
          "$RUNNER_TEMP/repo" manifest -r > ../reports/resolved-manifest.xml
          git -C common status --porcelain | tee ../reports/common-status.txt
          test ! -s ../reports/common-status.txt
          df -h .
      - name: Recover previously verified clean Rust type records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45243348628 --repo "$GITHUB_REPOSITORY" --name nezha-r74-droidspaces-45243348628 --dir type-reference
          test -s type-reference/clean/kernel.symtypes
          cp -a type-reference/clean reports/clean
          awk '$3=="vmlinux" {print $2,$1}' baseline-reference/Module.symvers | LC_ALL=C sort | cmp - reports/clean/exports
      - name: Initialize diagnostic config fragment
        uses: ./.github/actions/initialize-config-fragment
      - name: Add only the original DroidSpaces group
        if: matrix.feature == 'droidspaces'
        uses: ./.github/actions/droidspaces
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: '6.12'
          os_patch_level: '2026-03'
          sublevel: '69'
          droidspaces_commit: cdadb9eb5d0f86aacffff60776333e6f6b73a30a
      - name: Move SysV state out of task_struct without changing original C or Rust ABI
        run: |
          python3 -m py_compile .github/scripts/nezha_ds_candidate.py
          cp kernel/common/include/linux/sched.h reports/pre-candidate-sched.h
          python3 .github/scripts/nezha_ds_candidate.py apply kernel/common
          python3 .github/scripts/nezha_ds_candidate.py instrument kernel/common
          cp kernel/common/include/linux/sched.h reports/candidate-sched.h
      - name: Record exact diagnostic changes
        run: |
          cp kernel/common/wild_defconfig.fragment reports/requested.fragment
          git -C kernel/common diff --binary > reports/source-changes.patch
          git -C kernel/common status --porcelain > reports/modified-source-status.txt
      - name: Compile isolated 4K group without any CRC edits
        id: compile
        timeout-minutes: 90
        working-directory: kernel
        run: tools/bazel build --config=fast --jobs=3 --defconfig_fragment=//common:wild_defconfig.fragment //common:kernel_aarch64
      - name: Original Binder static regression gate
        run: |
          cp kernel/bazel-bin/common/kernel_aarch64/Image reports/Image
          cp kernel/bazel-bin/common/kernel_aarch64/Module.symvers reports/Module.symvers
          for bindings in kernel/bazel-bin/common/kernel_aarch64/rust/bindings/bindings_generated.rs kernel/bazel-bin/common/kernel_aarch64/bindings_generated.rs; do
            if [ -s "$bindings" ]; then cp "$bindings" reports/bindings_generated.rs; break; fi
          done
          test -s reports/bindings_generated.rs
          cp kernel/bazel-bin/common/kernel_aarch64/rust/{kernel,bindings}.symtypes reports/
          python3 .github/scripts/nezha_type_delta.py
          cp kernel/bazel-bin/common/kernel_aarch64_config/out_dir/.config reports/built.config
          grep -qx 'CONFIG_ARM64_4K_PAGES=y' reports/built.config
          python3 .github/scripts/nezha_baseline.py verify --module original-modules/flatten/lib/modules/rust_binder.ko --symvers reports/Module.symvers --output reports/binder-result.json
          sha256sum reports/Image reports/Module.symvers reports/built.config | tee reports/SHA256SUMS
      - name: Reject lost config, moved task fields or baseline export CRC drift
        if: ${{ !cancelled() && hashFiles('reports/Module.symvers', 'reports/built.config') != '' }}
        run: python3 .github/scripts/nezha_ds_candidate.py compare baseline-reference reports
      - name: Run actual ARM64 state and IPC lifecycle tests under QEMU
        shell: bash
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' }}
        timeout-minutes: 35
        run: |
          cd kernel/common
          python3 tools/testing/kunit/kunit.py run --arch arm64 --cross_compile aarch64-linux-gnu- --kunitconfig "$GITHUB_WORKSPACE/.github/scripts/nezha_sysv.kunitconfig" --build_dir "$RUNNER_TEMP/nezha-kunit" --jobs 3 --timeout 180 'nezha-sysv-state*' 2>&1 | tee "$GITHUB_WORKSPACE/reports/kunit.log"
      - name: Preserve diagnostic reports, never publish a flashable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nezha-r74-${{ matrix.feature }}-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
